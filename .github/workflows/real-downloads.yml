name: Real downloads

# Actually downloads short public videos from several sites, two ways:
#  - host:     yt-dlp on the runner with the app's exact options, both the build bundled in
#              the APK and the latest (what the app self-updates to). Tells "engine/site broken"
#              apart from "app broken".
#  - emulator: the debug app on a KVM emulator, through its real worker -> MediaStore path;
#              each saved file is pulled back and checked with ffprobe.
# The summary job writes a per-platform table to the run summary. GitHub's runners are
# datacenter IPs, so some sites refuse them (bot check / login wall); those show as BLOCKED,
# never as a pass.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'scripts/ci/real-downloads/**'
      - '.github/workflows/real-downloads.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # daily: sites break without us changing anything
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-downloads-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLED_YTDLP: '2025.11.12'   # the yt-dlp youtubedl-android 0.18.1 ships in the APK
  QUICKJS: 'v0.14.0'            # quickjs-ng, the JS runtime the library bundles

jobs:
  host:
    name: Host yt-dlp (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [latest, bundled]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Python minor as the one youtubedl-android bundles.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p bin
          curl -fsSL -o bin/qjs "https://github.com/quickjs-ng/quickjs/releases/download/$QUICKJS/qjs-linux-x86_64"
          if [ "${{ matrix.engine }}" = bundled ]; then
            url="https://github.com/yt-dlp/yt-dlp/releases/download/$BUNDLED_YTDLP/yt-dlp"
          else
            url="https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp"
          fi
          curl -fsSL -o bin/yt-dlp "$url"
          chmod +x bin/*
          python bin/yt-dlp --version

      - name: Download matrix
        run: python scripts/ci/real-downloads/matrix.py host --ytdlp bin/yt-dlp --qjs "$PWD/bin/qjs" --label ${{ matrix.engine }} --out results-host-${{ matrix.engine }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-host-${{ matrix.engine }}
          path: results-host-${{ matrix.engine }}.json
          retention-days: 14

  emulator:
    name: App on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 34
      TARGET: google_apis
      ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build x86_64 debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-pixel6-v2

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          cores: 4
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Real downloads on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          cores: 4
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 360
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: OUT=real-downloads bash scripts/ci/real-downloads/emulator.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-emulator
          path: |
            real-downloads/results-emulator.json
            real-downloads/queue.json
            real-downloads/engine.txt
            real-downloads/logcat.txt
            real-downloads/final.png
          retention-days: 14

  summary:
    name: Summary
    needs: [host, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Per-platform table
        run: python3 scripts/ci/real-downloads/matrix.py summary results/results-emulator.json results/results-host-latest.json results/results-host-bundled.json --out summary.md
